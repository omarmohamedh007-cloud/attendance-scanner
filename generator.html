<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إنشاء كود الطالب</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>body { text-align: center; padding: 30px; font-family: sans-serif; }</style>
</head>
<body>
    <h2>توليد QR Code</h2>
    <input type="text" id="studentId" placeholder="الكود"><br>
    <input type="text" id="studentName" placeholder="الاسم"><br>
    <input type="text" id="studentGroup" placeholder="المجموعة"><br>
    <button onclick="generateQR()">إنشاء</button>
    <div id="qrcode"></div>
    <script>
        function generateQR() {
            let data = document.getElementById("studentId").value + " | " + document.getElementById("studentName").value + " | " + document.getElementById("studentGroup").value;
            document.getElementById("qrcode").innerHTML = "";
            new QRCode(document.getElementById("qrcode"), data);
        }
    </script>
</body>
</html>
