<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توليد QR Code للطلاب</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #121212; color: white; }
        input, select { padding: 12px; margin: 8px; width: 80%; max-width: 300px; border-radius: 6px; border: 1px solid #444; font-size: 16px; background: #222; color: white; text-align: center; }
        button { padding: 12px 25px; background: #28a745; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        #qr-container { margin-top: 20px; display: none; background: white; padding: 20px; border-radius: 10px; width: fit-content; margin-left: auto; margin-right: auto; }
    </style>
</head>
<body>

    <h2>توليد QR Code للطلاب (النسخة الإعدادية)</h2>
    <input type="text" id="studentId" placeholder="كود الطالب"><br>
    <input type="text" id="studentName" placeholder="اسم الطالب"><br>
    <input type="text" id="studentGroup" placeholder="المجموعة"><br>
    <select id="studentGrade">
        <option value="الأول الإعدادي">الصف الأول الإعدادي</option>
        <option value="الثاني الإعدادي">الصف الثاني الإعدادي</option>
        <option value="الثالث الإعدادي">الصف الثالث الإعدادي</option>
    </select><br>
    <button onclick="generateQR()">إنشاء الباركود</button>

    <div id="qr-container">
        <canvas id="qrCanvas"></canvas>
    </div>

    <script>
        function generateQR() {
            let id = document.getElementById("studentId").value.trim();
            let name = document.getElementById("studentName").value.trim();
            let group = document.getElementById("studentGroup").value.trim() || "غير محدد";
            let grade = document.getElementById("studentGrade").value;

            if(!id || !name) { alert("يرجى كتابة كود الطالب واسمه!"); return; }

            let dataObject = { id: id, name: name, group: group, grade: grade };
            let safeString = "QR_DATA:" + encodeURIComponent(JSON.stringify(dataObject));

            document.getElementById("qr-container").style.display = "block";
            new QRious({ element: document.getElementById("qrCanvas"), value: safeString, size: 220, level: 'H' });
        }
    </script>
</body>
</html>
