<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماسح الحضور</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 15px; background-color: #121212; color: #ffffff; }
        #reader { width: 100%; max-width: 400px; margin: 15px auto; border-radius: 10px; overflow: hidden; border: 2px solid #007bff; }
        table { width: 95%; margin: 20px auto; border-collapse: collapse; background: #1e1e1e; }
        th, td { border: 1px solid #333; padding: 10px; text-align: center; }
        th { background-color: #007bff; color: white; }
        .btn-excel { background: #17a2b8; color: white; padding: 12px 24px; border: none; font-size: 16px; cursor: pointer; border-radius: 8px; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>ماسح الحضور والتسجيل</h2>
    <div id="reader"></div>

    <button class="btn-excel" onclick="exportToCSV()">تنزيل شيت الحضور (Excel)</button>

    <h3>قائمة الحاضرين اليوم</h3>
    <table id="attendanceTable">
        <thead>
            <tr>
                <th>كود الطالب</th>
                <th>الاسم</th>
                <th>المجموعة</th>
                <th>الوقت</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        let records = [];

        function b64_to_utf8(str) {
            return decodeURIComponent(escape(window.atob(str)));
        }

        function onScanSuccess(decodedText) {
            let id = "", name = "", group = "";

            if (decodedText.startsWith("SAFE_")) {
                try {
                    let base64Str = decodedText.replace("SAFE_", "");
                    let jsonStr = b64_to_utf8(base64Str);
                    let data = JSON.parse(jsonStr);
                    id = data.id;
                    name = data.name;
                    group = data.group;
                } catch(e) {
                    alert("خطأ في قراءة الكود التشفيري!");
                    return;
                }
            } else {
                // دعم أرقام فقط أو صيغة قديمة
                id = decodedText;
                name = "غير معروف";
                group = "غير محدد";
            }

            let time = new Date().toLocaleTimeString("ar-EG");

            if(records.some(r => r.id === id)) {
                alert("⚠️ الطالب: " + name + " مسجل حضور بالفعل!");
                return;
            }

            records.push({ id, name, group, time });

            let table = document.getElementById("attendanceTable").querySelector("tbody");
            let row = table.insertRow(0);
            row.insertCell(0).innerText = id;
            row.insertCell(1).innerText = name;
            row.insertCell(2).innerText = group;
            row.insertCell(3).innerText = time;

            alert("✅ تم تسجيل حضور: " + name);
        }

        const html5QrCode = new Html5Qrcode("reader");
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };

        html5QrCode.start(
            { facingMode: "environment" },
            config,
            onScanSuccess
        ).catch(err => {
            html5QrCode.start({ facingMode: "user" }, config, onScanSuccess);
        });

        function exportToCSV() {
            if(records.length === 0) { alert("لا توجد بيانات حضور لتنزيلها!"); return; }
            let csvContent = "data:text/csv;charset=utf-8,\uFEFFكود الطالب,الاسم,المجموعة,الوقت\n";
            records.forEach(r => csvContent += `${r.id},${r.name},${r.group},${r.time}\n`);

            let encodedUri = encodeURI(csvContent);
            let link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "حضور_الطلاب.csv");
            document.body.appendChild(link);
            link.click();
        }
    </script>
</body>
</html>
