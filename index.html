<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماسح الحضور</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 15px; background-color: #121212; color: #ffffff; }
        #reader { width: 100%; max-width: 400px; margin: 15px auto; border-radius: 10px; overflow: hidden; border: 2px solid #007bff; }
        table { width: 95%; margin: 20px auto; border-collapse: collapse; background: #1e1e1e; }
        th, td { border: 1px solid #333; padding: 10px; text-align: center; }
        th { background-color: #007bff; color: white; }
        .btn-excel { background: #28a745; color: white; padding: 12px 24px; border: none; font-size: 16px; cursor: pointer; border-radius: 8px; margin-top: 15px; font-weight: bold; }
        .btn-excel:hover { background: #218838; }
    </style>
</head>
<body>

    <h2>ماسح الحضور (النسخة الإعدادية)</h2>
    <div id="reader"></div>

    <button class="btn-excel" onclick="exportTableToExcel()">تنزيل شيت الحضور (Excel)</button>

    <h3>قائمة الحاضرين</h3>
    <table id="attendanceTable">
        <thead>
            <tr>
                <th>كود الطالب</th>
                <th>اسم الطالب</th>
                <th>المجموعة</th>
                <th>الصف الدراسي</th>
                <th>وقت الحضور</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        let records = [];

        function onScanSuccess(decodedText) {
            let data = {};
            try {
                if (decodedText.startsWith("QR_DATA:")) {
                    data = JSON.parse(decodeURIComponent(decodedText.replace("QR_DATA:", "")));
                } else {
                    alert("هذا الباركود غير متوافق مع النظام المحدث!");
                    return;
                }
            } catch(e) { alert("خطأ في قراءة البيانات!"); return; }

            if(records.some(r => r.id === data.id)) {
                alert("⚠️ " + data.name + " مسجل حضور بالفعل!");
                return;
            }

            data.time = new Date().toLocaleTimeString("ar-EG");
            records.push(data);

            let table = document.getElementById("attendanceTable").querySelector("tbody");
            let row = table.insertRow(0);
            row.insertCell(0).innerText = data.id;
            row.insertCell(1).innerText = data.name;
            row.insertCell(2).innerText = data.group;
            row.insertCell(3).innerText = data.grade;
            row.insertCell(4).innerText = data.time;

            alert("✅ تم تسجيل حضور: " + data.name);
        }

        const html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, onScanSuccess).catch(err => {
            html5QrCode.start({ facingMode: "user" }, { fps: 10, qrbox: 250 }, onScanSuccess);
        });

        // دالة تصدير الجدول مباشرة إلى ملف .xls مشفر بخانات منفصلة
        function exportTableToExcel() {
            let table = document.getElementById("attendanceTable");
            let html = table.outerHTML;

            let blob = new Blob(['\ufeff' + html], {
                type: 'application/vnd.ms-excel;charset=utf-8'
            });

            let url = URL.createObjectURL(blob);
            let a = document.createElement("a");
            a.href = url;
            a.download = "حضور_الطلاب.xls";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
